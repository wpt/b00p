name: CI

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version: "1.26.5"
      - run: go vet ./...
      - name: staticcheck
        # 2024.1.x pulls an x/tools that fails to compile on Go 1.26
        # ("invalid array length -delta*delta" in tokeninternal). 2025.1.1
        # is the first release that builds cleanly on 1.26 — bump
        # intentionally if a newer Go version requires it.
        run: go run honnef.co/go/tools/cmd/staticcheck@2025.1.1 ./...
      - name: govulncheck
        # v1.1.x and v1.2.x share the same x/tools break on Go 1.26.
        # v1.3.0 is the first version that compiles cleanly.
        run: go run golang.org/x/vuln/cmd/govulncheck@v1.3.0 ./...
      - name: Run tests with coverage and race detector
        # CGO_ENABLED=1 is required for -race. ubuntu-latest with setup-go
        # already enables CGO by default, but pinning it explicitly here
        # documents the dependency and prevents a surprise red build if the
        # runner image, the action, or a future Go toolchain flips the
        # default to 0 (e.g. minimal/distroless variants). Without CGO this
        # step fails fast with "-race requires cgo; enable cgo by setting
        # CGO_ENABLED=1" — the explicit env keeps that from happening.
        env:
          CGO_ENABLED: "1"
        run: go test ./... -race -coverprofile=coverage.out -covermode=atomic
      - name: Compute coverage percentage
        id: cov
        run: |
          PCT=$(go tool cover -func=coverage.out | awk '/^total:/ {print $3}' | tr -d '%')
          echo "pct=$PCT" >> "$GITHUB_OUTPUT"
          echo "Coverage: ${PCT}%"
      - name: Stage coverage badge JSON
        if: github.ref == 'refs/heads/master' && github.event_name == 'push'
        run: |
          mkdir -p .pages
          PCT="${{ steps.cov.outputs.pct }}"
          # shields.io endpoint schema: https://shields.io/endpoint
          # Color thresholds: <50 red, <70 yellow, <85 yellowgreen, <95 green, else brightgreen.
          awk -v pct="$PCT" 'BEGIN {
            color = "brightgreen"
            if (pct+0 < 50) color = "red"
            else if (pct+0 < 70) color = "yellow"
            else if (pct+0 < 85) color = "yellowgreen"
            else if (pct+0 < 95) color = "green"
            printf "{\"schemaVersion\":1,\"label\":\"coverage\",\"message\":\"%.1f%%\",\"color\":\"%s\"}\n", pct, color
          }' > .pages/coverage.json
          cat .pages/coverage.json
      - name: Upload coverage badge artifact
        if: github.ref == 'refs/heads/master' && github.event_name == 'push'
        uses: actions/upload-artifact@v7
        with:
          name: coverage-badge
          path: .pages/coverage.json
          retention-days: 1

  test-windows:
    # Windows is a first-class target with Windows-specific invariants
    # (NTFS case folding in dirReserver, reserved device names, rename
    # semantics) — run the actual test suite on it instead of relying on
    # goreleaser cross-builds. Lean job: vet + race tests; lints and
    # coverage stay on the Linux job.
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version: "1.26.5"
      - run: go vet ./...
      - name: Run tests with race detector
        # windows-latest ships MinGW gcc, which -race needs for cgo linking.
        env:
          CGO_ENABLED: "1"
        run: go test ./... -race

  publish-coverage:
    needs: test
    if: github.ref == 'refs/heads/master' && github.event_name == 'push'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Download coverage badge artifact
        uses: actions/download-artifact@v8
        with:
          name: coverage-badge
          path: .pages
      - name: Publish coverage badge to gh-pages
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./.pages
          publish_branch: gh-pages
          keep_files: true
          enable_jekyll: false
          commit_message: "chore(ci): update coverage badge"

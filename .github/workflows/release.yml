name: Release

on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: actions/setup-go@v7
        with:
          go-version: "1.26.6"
      - uses: goreleaser/goreleaser-action@v7
        with:
          # Pin to goreleaser v2.x so artifact naming/format is reproducible
          # across the v0.x.y release series. Bump intentionally, not silently.
          version: "~> v2"
          args: release --clean
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
